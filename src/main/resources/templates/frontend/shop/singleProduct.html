<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
				xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><!-- 引用head -->
<head>
    <title>FanWorld</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="author" content="">
    <meta name="keywords" content="">
    <meta name="description" content="">
    
    <meta name="memId" th:content="${session.memId}">
    

    <th:block th:replace="~{frontend/fragments/commonCSS :: commonCSS}"></th:block>
    
    <link rel="stylesheet" type="text/css" th:href="@{/css/frontend/shop/singleProduct.css}">

    

    <!-- script
    ================================================== -->
    <script th:src="@{/js/frontend/modernizr.js}"></script>
</head>
<body>
<!-- 引用header -->
<div th:replace="frontend/fragments/header :: header"></div>
<section class="hero-section bg-gray d-flex align-items-center justify-content-center padding-medium pb-5">
    <div class="hero-content">
        <div class="container">
            <div class="row">
                <div class="text-center padding-medium no-padding-bottom">
                    <h1>About</h1>
                        <div class="breadcrumbs">
                <span class="item">
                  <a href="index.html">Home ></a>
                </span>
                            <span class="item">About</span>
                        </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ========================以下區域可放置其他內容======================== -->

<div class="card-wrapper">
    <div class="card">
        <!-- card left -->
        <div class="product-imgs">
            <div class="img-display">
                <img class="product-pic" th:src="@{/reader/ProductGifReader(productId=${productVO.productId})}" alt="Image">
            </div>
        </div>
        <!-- card right -->
        <div class="products" th:id="${productVO.productId}">
            <h2 class="product-title" th:text="${productVO.productName}"></h2>
            <div class="product-detail">
                <h2>商品介紹: </h2>
                <p><span th:text="${productVO.productInfo}"></span></p>
                <ul>
                    <li>宅配配送區域: <span>台灣本島</span></li>
                    <li>宅配運費: <span>視距離而定，貨到付款</span></li>
                </ul>
            </div>
            <div class="product-price">
                <p class="price">$NT: <span id="merchPrice" th:text="${productVO.productPrice}"></span></p>
            </div>
            <!-- 加入購物車按鈕 -->
            <div class="page-wrapper">
                <input id="quantityInput" type="number" min="1" th:value="1">
<!--                 <input id="memId" type="hidden" th:value="${memId}"> -->
                <input id="productId" type="hidden" name="action" th:value="${productVO.productId}">
                <input id="productName" type="hidden" name="action" th:value="${productVO.productName}">
                <input id="productPic" type="hidden" name="action" th:value="${productVO.productPic}">
                <input id="productPrice" type="hidden" name="action" th:value="${productVO.productPrice}">
                <input id="sellerId" type="hidden" name="action" th:value="${productVO.seller.sellerId}">
                <button id="add-to-cart" class="add-to-cart">加入購物車</button>
            </div>
        </div>
    </div>
</div>

<div class="seller-info card mt-5 p-4 shadow">
    <h3 class="mb-3">商家資訊</h3>
    <p><strong>商家名稱：</strong> <span th:text="${productVO.seller.sellerName}">商家名稱</span></p>
    <p><strong>聯絡電話：</strong> <span th:text="${productVO.seller.sellerMobile}">電話</span></p>
    <p><strong>Email：</strong> <span th:text="${productVO.seller.sellerEmail}">email@example.com</span></p>
<button class="btn btn-primary mt-3" id="chatWithSeller"
        th:data-seller-id="${productVO.seller.sellerId}"
        th:data-seller-name="${productVO.seller.sellerName}">
    私訊商家
</button>
</div>



<!-- ========================以上區域可放置其他內容======================== -->
<!-- 引用chat -->
<div th:replace="frontend/fragments/chatbox :: chatbox"></div>



<!-- 引用footer -->
<div th:replace="frontend/fragments/footer :: footer"></div>

<!-- 共用JS -->
<th:block th:replace="frontend/fragments/commonJS :: commonJS"></th:block>


</body>
</html>
